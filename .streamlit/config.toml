# Streamlit Configuration for Production Deployment
# This file configures Streamlit settings for the Hybris JSON Generator application

# Server Configuration
[server]
port = 8501
headless = true
runOnSave = false
logger.level = "info"
enableXsrfProtection = true

# Client Configuration
[client]
showErrorDetails = false
toolbarMode = "minimal"

# Browser Configuration
[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"

# Theme Configuration (Optional - can be customized)
[theme]
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

# Runtime Configuration
[logger]
level = "info"

# Session Configuration
[client]
toolbarMode = "minimal"
